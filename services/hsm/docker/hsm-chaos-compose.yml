# Three virtual HSM members for services/hsm/tests/docker/
# hsm_chaos_test.cpp (.kiro/specs/virtual-hsm/ task 11b, Requirement
# 13.6), in any of three layouts from one image:
#
#   * stand-alone (the default): `hsm_node`, the HSM module alone;
#   * co-located: KYTHIRA_HSM_CHAOS_DAEMON=/usr/local/bin/kythira_node and
#     KYTHIRA_HSM_CHAOS_SERVICES=hsm,redis, so the HSM shares each node's
#     process, Raft listener and data directory with the Redis module;
#   * encrypted services (.kiro/specs/kms-compatible-api/ task 19,
#     Requirement 14.5): kythira_node with KYTHIRA_HSM_CHAOS_SERVICES=
#     hsm,kms,dynamodb,kinesis. The KMS keeps its backing keys on the
#     co-located HSM's token (`hsm.pkcs11`, as the application identity
#     the test binds to the token), and DynamoDB and Kinesis encrypt
#     through the co-located KMS. The test's static key file (/pki/keys)
#     and the token's user PIN (/pki/kms-pin) are in the PKI directory.
#   * KMS layers (.kiro/specs/kms-independent-layers/ task 6,
#     Requirement 11.3): kythira_node with KYTHIRA_HSM_CHAOS_SERVICES=
#     hsm,kms on hsm-1 .. hsm-3, and the `kms-layers` profile's kms-4 (a
#     catalog data node), kms-5 (a gateway alone) and kms-6 (a front end
#     alone, reaching the HSM through libkythira_pkcs11.so and
#     /pki/pkcs11.conf, as an application host would). The test moves the
#     KMS between layouts by recreating one member at a time with new
#     roles (KYTHIRA_HSM_CHAOS_KMS_ROLES_N), data nodes
#     (KYTHIRA_HSM_CHAOS_KMS_URLS) and front ends
#     (KYTHIRA_HSM_CHAOS_KMS_FRONT_ENDS_N); a recreated container keeps its
#     /data volume.
#
# The test SIGKILLs members, starts them again and cuts them off the
# network while it generates keys and rekeys the master key. A killed
# member keeps its /data volume, so it rejoins as the same voter (sealed,
# as after any restart, until the operator's shares unseal it).
#
# CLAUDE.md's container rules, as they apply here:
#
#   * **No static IPs.** Raft peers, the members' forwarding to the leader
#     and every certificate name address members by **service name**
#     (hsm-1 .. hsm-3).
#   * **No runtime named anywhere.** The test drives this file through
#     `container_runtime()` / `compose_prefix()`
#     (tests/docker_chaos/os_faults.hpp).
#   * **No capabilities, no privileged or host networking.** Faults are
#     `kill` (SIGKILL), `start`, and `network disconnect`/`connect`, which
#     rootless Podman allows. Key memory is allowed to stay unlocked, since
#     locking it would need CAP_IPC_LOCK.
#
# The test writes a throwaway PKI into a host directory, world-readable so
# uid 10001 can read it under Docker's uid mapping and rootless Podman's
# alike, and passes it in as KYTHIRA_HSM_CHAOS_PKI_DIR: a CA, one
# certificate per member (its service name, localhost and 127.0.0.1 as DNS
# and IP SANs, spiffe://hsm/node-N as its identity), the operator's and the
# application's. Raft, the operator API and the PKCS#11 listener are all
# mutual TLS.
#
# The operator API and the PKCS#11 listener are published on loopback at
# ports the test picks (KYTHIRA_HSM_CHAOS_API_N, _CLIENTS_N), and so are
# the KMS, DynamoDB and Kinesis APIs (_KMS_N, _DDB_N, _KINESIS_N), which
# only the encrypted-services layout serves. All are TLS with the
# member's certificate. The network
# has a fixed name so the test can disconnect a member from it, and
# reconnects it with its service-name alias.

name: kythira-hsm-chaos

x-node: &node
  image: kythira-hsm-chaos:dev
  entrypoint: ["${KYTHIRA_HSM_CHAOS_DAEMON:-/usr/local/bin/hsm_node}"]
  networks:
    hsm_chaos_net: {}

x-node-env: &node-env
  KYTHIRA_SERVICES: "${KYTHIRA_HSM_CHAOS_SERVICES:-hsm}"
  KYTHIRA_NODE_DATA_DIR: /data
  # The KMS-layers layout lists kms-4 .. kms-6 too (its catalog's data
  # node joins the members' Raft listeners).
  KYTHIRA_NODE_PEERS: "${KYTHIRA_HSM_CHAOS_PEERS:-1=hsm-1:7100,2=hsm-2:7100,3=hsm-3:7100}"
  KYTHIRA_NODE_RAFT_BIND: 0.0.0.0
  KYTHIRA_NODE_RAFT_PORT: "7100"
  KYTHIRA_NODE_TLS_CA: /pki/ca.pem
  KYTHIRA_HSM_API_LISTEN: 0.0.0.0:9443
  KYTHIRA_HSM_API_URLS: "1=https://hsm-1:9443,2=https://hsm-2:9443,3=https://hsm-3:9443"
  KYTHIRA_HSM_PEER_IDENTITIES: "spiffe://hsm/node-1,spiffe://hsm/node-2,spiffe://hsm/node-3"
  KYTHIRA_HSM_OPERATORS: spiffe://test/operator
  KYTHIRA_HSM_CLIENT_LISTEN: 0.0.0.0:9444
  KYTHIRA_HSM_ALLOW_UNLOCKED_MEMORY: "true"
  KYTHIRA_HSM_PIN_COST_LOG2: "10"
  # Slow CI disks and two runtimes' network stacks: the 300-600 ms
  # defaults would elect on every burst of writes.
  KYTHIRA_ELECTION_TIMEOUT_MIN_MS: "1000"
  KYTHIRA_ELECTION_TIMEOUT_MAX_MS: "2000"
  KYTHIRA_HEARTBEAT_INTERVAL_MS: "150"
  # Read only by kythira_node in the co-located layout: Redis on plaintext
  # RESP with no ACL, in memory.
  KYTHIRA_REDIS_LISTEN: 0.0.0.0:6379
  KYTHIRA_REDIS_ALLOW_ANONYMOUS: "1"
  KYTHIRA_CACHE_PERSISTENCE: memory
  # Read only by kythira_node in the encrypted-services layout. The KMS
  # on :8443, its members forwarding to its catalog's leader by service
  # name; DynamoDB on :8000 and Kinesis on :4567, their peers defaulting
  # to hsm-N at the same port. Static keys for all three, one file.
  KYTHIRA_KMS_API_LISTEN: 0.0.0.0:8443
  # The KMS-layers layout sets the catalog's data nodes, its founding
  # voters and every node's identity as its moves go; see below.
  KYTHIRA_KMS_API_URLS: "${KYTHIRA_HSM_CHAOS_KMS_URLS:-1=https://hsm-1:8443,2=https://hsm-2:8443,3=https://hsm-3:8443}"
  KYTHIRA_KMS_PEER_IDENTITIES: "${KYTHIRA_HSM_CHAOS_KMS_IDENTITIES:-spiffe://hsm/node-1,spiffe://hsm/node-2,spiffe://hsm/node-3}"
  KYTHIRA_KMS_VOTERS: "${KYTHIRA_HSM_CHAOS_KMS_VOTERS:-}"
  KYTHIRA_KMS_FRONT_END_PROBE_MS: "500"
  KYTHIRA_KMS_AUTH: static
  KYTHIRA_KMS_STATIC_KEYS_FILE: /pki/keys
  KYTHIRA_KMS_PKCS11: hsm
  KYTHIRA_KMS_PKCS11_IDENTITY: spiffe://test/app
  KYTHIRA_KMS_TOKEN_LABEL: alpha
  KYTHIRA_KMS_PIN_FILE: /pki/kms-pin
  KYTHIRA_KMS_JOB_INTERVAL_MS: "500"
  KYTHIRA_DYNAMODB_BIND: 0.0.0.0
  KYTHIRA_DYNAMODB_PORT: "8000"
  KYTHIRA_DYNAMODB_AUTH: static
  KYTHIRA_DYNAMODB_STATIC_KEYS_FILE: /pki/ddb-keys
  KYTHIRA_DYNAMODB_ACCOUNT_ID: "111122223333"
  KYTHIRA_DYNAMODB_FORWARD_SECRET: kythira-hsm-chaos-ddb-forward-secret
  KYTHIRA_DYNAMODB_ENGINE: rocksdb
  KYTHIRA_DYNAMODB_DISK_FLOOR_BYTES: "0"
  KYTHIRA_DYNAMODB_COMPAT: throttling=off
  KYTHIRA_DYNAMODB_KMS: kythira
  KINESIS_LISTEN: 0.0.0.0:4567
  KINESIS_AUTH: static
  KINESIS_STATIC_KEYS_FILE: /pki/keys
  KINESIS_REGION: us-east-1
  KINESIS_FORWARD_SECRET: kythira-hsm-chaos-kinesis-forward-secret
  KINESIS_KMS: kythira
  KINESIS_DISK_FLOOR_BYTES: "0"
  # Every module's Raft logs sealed at rest under a passphrase-wrapped key
  # ring (.kiro/specs/raft-log-encryption/), so the encrypted-services scan
  # can search the logs too. hsm_node reads it in every layout.
  KYTHIRA_RAFT_LOG_KMS: local
  KYTHIRA_RAFT_LOG_PASSPHRASE: kythira-hsm-chaos-raft-log-passphrase

services:
  hsm-1:
    <<: *node
    container_name: kythira-hsm-chaos-1
    hostname: hsm-1
    environment:
      <<: *node-env
      KYTHIRA_NODE_ID: "1"
      KYTHIRA_NODE_TLS_CERT: /pki/node-1.pem
      KYTHIRA_NODE_TLS_KEY: /pki/node-1.key
      KYTHIRA_KMS_ROLES: "${KYTHIRA_HSM_CHAOS_KMS_ROLES_1:-}"
      KYTHIRA_KMS_FRONT_END_URLS: "${KYTHIRA_HSM_CHAOS_KMS_FRONT_ENDS_1:-}"
    volumes:
      - ${KYTHIRA_HSM_CHAOS_PKI_DIR:?the scenario test sets it}:/pki:ro
      - hsm-1-data:/data
    ports:
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_API_1:-19441}:9443"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_CLIENTS_1:-19451}:9444"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KMS_1:-19461}:8443"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_DDB_1:-19471}:8000"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KINESIS_1:-19481}:4567"

  hsm-2:
    <<: *node
    container_name: kythira-hsm-chaos-2
    hostname: hsm-2
    environment:
      <<: *node-env
      KYTHIRA_NODE_ID: "2"
      KYTHIRA_NODE_TLS_CERT: /pki/node-2.pem
      KYTHIRA_NODE_TLS_KEY: /pki/node-2.key
      KYTHIRA_KMS_ROLES: "${KYTHIRA_HSM_CHAOS_KMS_ROLES_2:-}"
      KYTHIRA_KMS_FRONT_END_URLS: "${KYTHIRA_HSM_CHAOS_KMS_FRONT_ENDS_2:-}"
    volumes:
      - ${KYTHIRA_HSM_CHAOS_PKI_DIR:?the scenario test sets it}:/pki:ro
      - hsm-2-data:/data
    ports:
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_API_2:-19442}:9443"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_CLIENTS_2:-19452}:9444"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KMS_2:-19462}:8443"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_DDB_2:-19472}:8000"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KINESIS_2:-19482}:4567"

  hsm-3:
    <<: *node
    container_name: kythira-hsm-chaos-3
    hostname: hsm-3
    environment:
      <<: *node-env
      KYTHIRA_NODE_ID: "3"
      KYTHIRA_NODE_TLS_CERT: /pki/node-3.pem
      KYTHIRA_NODE_TLS_KEY: /pki/node-3.key
      KYTHIRA_KMS_ROLES: "${KYTHIRA_HSM_CHAOS_KMS_ROLES_3:-}"
      KYTHIRA_KMS_FRONT_END_URLS: "${KYTHIRA_HSM_CHAOS_KMS_FRONT_ENDS_3:-}"
    volumes:
      - ${KYTHIRA_HSM_CHAOS_PKI_DIR:?the scenario test sets it}:/pki:ro
      - hsm-3-data:/data
    ports:
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_API_3:-19443}:9443"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_CLIENTS_3:-19453}:9444"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KMS_3:-19463}:8443"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_DDB_3:-19473}:8000"
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KINESIS_3:-19483}:4567"

  kms-4:
    <<: *node
    profiles: ["kms-layers"]
    entrypoint: ["/usr/local/bin/kythira_node"]
    container_name: kythira-kms-layers-4
    hostname: kms-4
    environment:
      <<: *node-env
      KYTHIRA_SERVICES: kms
      KYTHIRA_NODE_ID: "4"
      KYTHIRA_NODE_TLS_CERT: /pki/node-4.pem
      KYTHIRA_NODE_TLS_KEY: /pki/node-4.key
      KYTHIRA_KMS_ROLES: data
      KYTHIRA_KMS_PIN_FILE: ""
    volumes:
      - ${KYTHIRA_HSM_CHAOS_PKI_DIR:?the scenario test sets it}:/pki:ro
      - kms-4-data:/data
    ports:
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KMS_4:-19464}:8443"

  kms-5:
    <<: *node
    profiles: ["kms-layers"]
    entrypoint: ["/usr/local/bin/kythira_node"]
    container_name: kythira-kms-layers-5
    hostname: kms-5
    environment:
      <<: *node-env
      KYTHIRA_SERVICES: kms
      KYTHIRA_NODE_ID: "5"
      KYTHIRA_NODE_TLS_CERT: /pki/node-5.pem
      KYTHIRA_NODE_TLS_KEY: /pki/node-5.key
      KYTHIRA_KMS_ROLES: gateway
      KYTHIRA_KMS_FRONT_END_URLS: "${KYTHIRA_HSM_CHAOS_KMS_FRONT_ENDS_5:-}"
      KYTHIRA_KMS_PIN_FILE: ""
    volumes:
      - ${KYTHIRA_HSM_CHAOS_PKI_DIR:?the scenario test sets it}:/pki:ro
      - kms-5-data:/data
    ports:
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KMS_5:-19465}:8443"

  kms-6:
    <<: *node
    profiles: ["kms-layers"]
    entrypoint: ["/usr/local/bin/kythira_node"]
    container_name: kythira-kms-layers-6
    hostname: kms-6
    environment:
      <<: *node-env
      KYTHIRA_SERVICES: kms
      KYTHIRA_NODE_ID: "6"
      KYTHIRA_NODE_TLS_CERT: /pki/node-6.pem
      KYTHIRA_NODE_TLS_KEY: /pki/node-6.key
      KYTHIRA_KMS_ROLES: front_end
      KYTHIRA_KMS_FRONT_END_URLS: "${KYTHIRA_HSM_CHAOS_KMS_FRONT_ENDS_6:-}"
      KYTHIRA_KMS_PIN_FILE: "/pki/kms-pin"
      KYTHIRA_KMS_PKCS11: /usr/local/lib/libkythira_pkcs11.so
      KYTHIRA_PKCS11_CONF: /pki/pkcs11.conf
    volumes:
      - ${KYTHIRA_HSM_CHAOS_PKI_DIR:?the scenario test sets it}:/pki:ro
      - kms-6-data:/data
    ports:
      - "127.0.0.1:${KYTHIRA_HSM_CHAOS_KMS_6:-19466}:8443"

volumes:
  hsm-1-data:
  hsm-2-data:
  hsm-3-data:
  kms-4-data:
  kms-5-data:
  kms-6-data:

networks:
  hsm_chaos_net:
    name: kythira_hsm_chaos_net
    driver: bridge
