# The Redis command registry (.kiro/specs/redis-general-data-types/ task 1,
# design Component 2). services/redis/tools/gen_redis_commands.py turns it
# into include/kythira/redis/redis_command_ids.hpp; the test
# redis_command_ids_header_fresh fails when the two disagree, so edit this
# file and regenerate:
#
#   python3 services/redis/tools/gen_redis_commands.py \
#       services/redis/tools/redis_commands.yaml \
#       services/redis/include/kythira/redis/redis_command_ids.hpp
#
# Rules:
# - `id` is what a format-0x03 `exec` log record carries for the command.
#   Once merged, an id is never changed or given to another command, and a
#   command is never deleted: a removed one moves to `retired` below, so its
#   id stays taken. redis_command_registry_test pins every id ever issued
#   (golden/redis/command_ids.txt) and allows additions only.
# - New commands take the next unused id, whatever their position.
# - `status: planned` registers a command a later task ships, so its id is
#   fixed now; the gateway still answers `-ERR unknown command` for it.
# - `flags`, `acl` and `keys` (first, last, step) are Redis's COMMAND INFO
#   values; `path` is the design's column (R W M F A, L local); `task` is the
#   spec task that ships the command (0: an earlier spec).
#
# The format is a strict subset of YAML that the generator parses itself
# (no PyYAML dependency): `commands:` and `retired:` lists of flat maps,
# scalar values, and `[a, b]` flow lists.

commands:
  - name: GET
    id: 1
    group: string
    since: 1.0.0
    arity: 2
    flags: [readonly, fast]
    acl: [read, string, fast]
    keys: [1, 1, 1]
    path: R
    status: shipped
    task: 0
