# The migration path in containers (.kiro/specs/sqs-compatible-queues/
# task 11, Requirements 12.1-12.3), driven by sqs_path_scenario_test:
# three co-located nodes split into three layers (data, front end, gateway)
# and folded back onto three new co-located nodes, under load, with one node
# of every layer killed on the way (doc/migration.md).
#
#   sqs-1..3   every role, the group's founders
#   sqs-4..6   data only, joining (profile `split`)
#   fe-1, fe-2 front ends (profile `split`)
#   gw-1, gw-2 gateways (profile `split`)
#   sqs-7..9   every role, joining on the way back (profile `back`)
#   clients    the load and sqs_admin.py (profile `clients`)
#
# CLAUDE.md's container rules, as they apply here:
#
#   * **No static IPs.** No `ipam`, no `ipv4_address`; rootless Podman drops
#     them silently. Raft RPC, the internal routes and every client address
#     nodes by **service name**.
#   * **No runtime named anywhere.** The scenario test drives this file
#     through `container_runtime()` / `compose_prefix()`
#     (tests/docker_chaos/os_faults.hpp), honouring
#     $KYTHIRA_CONTAINER_RUNTIME and $KYTHIRA_COMPOSE_COMMAND.
#   * **No capabilities, no privileged or host networking.**
#
# Everything is plaintext inside this private network: what the scenario
# checks is the path, and the layers' TLS and identities have their own
# tests (sqs_layers_test, the split-tls client suite). Nothing is published
# on the host, so two stacks never contend for a port. Each data node keeps
# its replica in a named volume, so a killed node starts again where it
# stopped and `down -v` is a clean slate. A node's environment names only
# the members it starts with; the scenario announces the rest
# (sqs_admin.py peer), which the nodes keep in their data directories.

name: kythira-sqs-scenario

x-env: &env
  KYTHIRA_NODE_INSECURE_PLAINTEXT: "1"
  SQS_ALLOW_PLAINTEXT: "1"
  SQS_STATIC_KEYS_FILE: /etc/sqs/keys
  SQS_FORWARD_SECRET: sqs-scenario-forward-secret
  KYTHIRA_LOG_LEVEL: warning
  KYTHIRA_NODE_RAFT_BIND: 0.0.0.0
  KYTHIRA_NODE_RAFT_PORT: "7000"
  KYTHIRA_NODE_DATA_DIR: /var/lib/sqs
  SQS_LISTEN: 0.0.0.0:9324
  SQS_COMPAT: delete-cooldown=0,purge-cooldown=0

services:
  sqs-1:
    image: kythira-sqs-node:dev
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "1"
      KYTHIRA_NODE_PEERS: "1=sqs-1:7000,2=sqs-2:7000,3=sqs-3:7000"
      SQS_PEER_ENDPOINTS: "1=http://sqs-1:9324,2=http://sqs-2:9324,3=http://sqs-3:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-1-data:/var/lib/sqs
  sqs-2:
    image: kythira-sqs-node:dev
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "2"
      KYTHIRA_NODE_PEERS: "1=sqs-1:7000,2=sqs-2:7000,3=sqs-3:7000"
      SQS_PEER_ENDPOINTS: "1=http://sqs-1:9324,2=http://sqs-2:9324,3=http://sqs-3:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-2-data:/var/lib/sqs
  sqs-3:
    image: kythira-sqs-node:dev
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "3"
      KYTHIRA_NODE_PEERS: "1=sqs-1:7000,2=sqs-2:7000,3=sqs-3:7000"
      SQS_PEER_ENDPOINTS: "1=http://sqs-1:9324,2=http://sqs-2:9324,3=http://sqs-3:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-3-data:/var/lib/sqs
  sqs-4:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "4"
      SQS_JOIN: "on"
      KYTHIRA_SQS_ROLES: "data"
      KYTHIRA_NODE_PEERS: "1=sqs-1:7000,2=sqs-2:7000,3=sqs-3:7000,4=sqs-4:7000"
      SQS_PEER_ENDPOINTS: "1=http://sqs-1:9324,2=http://sqs-2:9324,3=http://sqs-3:9324,4=http://sqs-4:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-4-data:/var/lib/sqs
  sqs-5:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "5"
      SQS_JOIN: "on"
      KYTHIRA_SQS_ROLES: "data"
      KYTHIRA_NODE_PEERS: "1=sqs-1:7000,2=sqs-2:7000,3=sqs-3:7000,5=sqs-5:7000"
      SQS_PEER_ENDPOINTS: "1=http://sqs-1:9324,2=http://sqs-2:9324,3=http://sqs-3:9324,5=http://sqs-5:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-5-data:/var/lib/sqs
  sqs-6:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "6"
      SQS_JOIN: "on"
      KYTHIRA_SQS_ROLES: "data"
      KYTHIRA_NODE_PEERS: "1=sqs-1:7000,2=sqs-2:7000,3=sqs-3:7000,6=sqs-6:7000"
      SQS_PEER_ENDPOINTS: "1=http://sqs-1:9324,2=http://sqs-2:9324,3=http://sqs-3:9324,6=http://sqs-6:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-6-data:/var/lib/sqs
  fe-1:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "11"
      KYTHIRA_SQS_ROLES: "front_end"
      KYTHIRA_NODE_PEERS: "11=fe-1:7000"
      SQS_DATA_ENDPOINTS: "http://sqs-1:9324,http://sqs-2:9324,http://sqs-3:9324,http://sqs-4:9324,http://sqs-5:9324,http://sqs-6:9324,http://sqs-7:9324,http://sqs-8:9324,http://sqs-9:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
  fe-2:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "12"
      KYTHIRA_SQS_ROLES: "front_end"
      KYTHIRA_NODE_PEERS: "12=fe-2:7000"
      SQS_DATA_ENDPOINTS: "http://sqs-1:9324,http://sqs-2:9324,http://sqs-3:9324,http://sqs-4:9324,http://sqs-5:9324,http://sqs-6:9324,http://sqs-7:9324,http://sqs-8:9324,http://sqs-9:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
  gw-1:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "21"
      KYTHIRA_SQS_ROLES: "gateway"
      KYTHIRA_NODE_PEERS: "21=gw-1:7000"
      SQS_FRONT_END_ENDPOINTS: "http://fe-1:9324,http://fe-2:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
  gw-2:
    image: kythira-sqs-node:dev
    profiles: [split]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "22"
      KYTHIRA_SQS_ROLES: "gateway"
      KYTHIRA_NODE_PEERS: "22=gw-2:7000"
      SQS_FRONT_END_ENDPOINTS: "http://fe-1:9324,http://fe-2:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
  sqs-7:
    image: kythira-sqs-node:dev
    profiles: [back]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "7"
      SQS_JOIN: "on"
      KYTHIRA_NODE_PEERS: "4=sqs-4:7000,5=sqs-5:7000,6=sqs-6:7000,7=sqs-7:7000"
      SQS_PEER_ENDPOINTS: "4=http://sqs-4:9324,5=http://sqs-5:9324,6=http://sqs-6:9324,7=http://sqs-7:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-7-data:/var/lib/sqs
  sqs-8:
    image: kythira-sqs-node:dev
    profiles: [back]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "8"
      SQS_JOIN: "on"
      KYTHIRA_NODE_PEERS: "4=sqs-4:7000,5=sqs-5:7000,6=sqs-6:7000,8=sqs-8:7000"
      SQS_PEER_ENDPOINTS: "4=http://sqs-4:9324,5=http://sqs-5:9324,6=http://sqs-6:9324,8=http://sqs-8:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-8-data:/var/lib/sqs
  sqs-9:
    image: kythira-sqs-node:dev
    profiles: [back]
    networks: [sqs_net]
    environment:
      <<: *env
      KYTHIRA_NODE_ID: "9"
      SQS_JOIN: "on"
      KYTHIRA_NODE_PEERS: "4=sqs-4:7000,5=sqs-5:7000,6=sqs-6:7000,9=sqs-9:7000"
      SQS_PEER_ENDPOINTS: "4=http://sqs-4:9324,5=http://sqs-5:9324,6=http://sqs-6:9324,9=http://sqs-9:9324"
    volumes:
      - ../clients/keys.txt:/etc/sqs/keys:ro
      - sqs-9-data:/var/lib/sqs
  clients:
    image: kythira-sqs-clients:dev
    profiles: [clients]
    networks: [sqs_net]
    environment:
      # services/sqs/tests/clients/keys.txt
      AWS_ACCESS_KEY_ID: AKIDEXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG+bPxRfiCYEXAMPLEKEY
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_FORWARD_SECRET: sqs-scenario-forward-secret
      # Every node the path serves clients from, in the order it does.
      SQS_ENDPOINTS: "http://sqs-1:9324,http://sqs-2:9324,http://sqs-3:9324,http://gw-1:9324,http://gw-2:9324,http://sqs-7:9324,http://sqs-8:9324,http://sqs-9:9324"

networks:
  sqs_net: {}

volumes:
  sqs-1-data: {}
  sqs-2-data: {}
  sqs-3-data: {}
  sqs-4-data: {}
  sqs-5-data: {}
  sqs-6-data: {}
  sqs-7-data: {}
  sqs-8-data: {}
  sqs-9-data: {}
