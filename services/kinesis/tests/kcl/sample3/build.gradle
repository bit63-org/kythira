// The KCL sample consumer built against KCL 3.x
// (.kiro/specs/kinesis-compatible-streams/ task 16). It compiles ../sample's
// SampleConsumer unchanged; only KythiraLeases is this project's own, since
// the Kythira lease layer implements KCL 2.x's interfaces. Its leases live
// in DynamoDB (KCL_LEASES=dynamodb): Kythira's, DynamoDB Local or AWS.

plugins {
    id 'application'
}

repositories {
    // Google's copy of Maven Central first. From GitHub's runners repo1 has
    // answered 404 for files it holds, on every retry for minutes on end:
    // POMs on #840 and, once POMs fell back here, JARs on #905. Gradle
    // fetches a module's JAR only from the repository that gave its POM, so
    // a fallback after repo1 can't cover a JAR miss; this mirror has to be
    // the one that answers.
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
    // repo1 (Maven Central itself) for anything the mirror doesn't have yet;
    // Gradle asks it only when the mirror answers 404.
    maven { url = 'https://repo1.maven.org/maven2' }
}

sourceSets {
    main {
        java {
            srcDir '../sample/src/main/java'
        }
    }
}

dependencies {
    implementation 'software.amazon.kinesis:amazon-kinesis-client:3.5.4'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'kythira.kcl.sample.SampleConsumer'
}
