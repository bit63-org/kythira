// The evidence scenario through aws-sdk-java-v2's synchronous Kinesis client
// (CBOR by default) and its async client (HTTP/2 for SubscribeToShard, used
// by task 13's evidence). Versions are pinned: the evidence records what
// exactly these versions send.

plugins {
    id 'application'
}

repositories {
    // Google's copy of Maven Central first. From GitHub's runners repo1 has
    // answered 404 for files it holds, on every retry for minutes on end:
    // POMs on #840 and, once POMs fell back here, JARs on #905. Gradle
    // fetches a module's JAR only from the repository that gave its POM, so
    // a fallback after repo1 can't cover a JAR miss; this mirror has to be
    // the one that answers.
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
    // repo1 (Maven Central itself) for anything the mirror doesn't have yet;
    // Gradle asks it only when the mirror answers 404.
    maven { url = 'https://repo1.maven.org/maven2' }
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.57.11')
    implementation 'software.amazon.awssdk:kinesis'
    implementation 'software.amazon.awssdk:url-connection-client'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'kythira.evidence.JavaSdkV2Client'
}
