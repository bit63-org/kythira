# The virtual HSM module's own workflow (services/hsm/, services/README.md
# "CI", .kiro/specs/virtual-hsm/ Requirement 1). ci.yml is the gate: it
# builds the module and runs its tests on every pull request, because
# ci_full_defconfig sets CONFIG_HSM=y. This workflow adds, for changes to the
# module or what it builds on:
#
#   - the boundary check (also in ci.yml's kconfig-check job);
#   - a module-on build of just the module's targets, with its tests (every
#     test labelled hsm), so a module change gets an answer in minutes
#     instead of after the full build-and-test legs;
#   - a module-off configure (configs/ci_no_hsm_defconfig) that asserts no
#     HSM target or hsm-module test exists with the switch off
#     (Requirement 1.4).
#
# The module-off configure does not build core: ci.yml's config-variants job
# already builds every target of minimal_defconfig, where CONFIG_HSM is off
# by default, and the boundary check's core-includes-module rule keeps core
# from including a module header at all.
#
# NOT a required check: GitHub reports nothing for a workflow its paths
# filter skips, so a required check from it would hang every unrelated pull
# request. Whoever merges a pull request that touches the module waits for
# this workflow too (services/README.md).
#
# The build job also runs libkythira_pkcs11.so under its consumers
# (pkcs11-tool, OpenSSL's pkcs11-provider, p11-kit and GnuTLS, Go, Java and
# pkcs11test), which only this job installs. The cluster job runs three
# hsm_node daemons with leader kills (task 11a); the container job runs the
# docker-chaos scenario in both layouts under Docker and rootless Podman
# (task 11b).

name: HSM Module

on:
  push:
    branches: [main]
    paths:
      - "services/hsm/**"
      # The chaos scenario's encrypted-services layout runs the KMS.
      - "services/kms/**"
      - "services/README.md"
      - "include/raft/pkcs11*.hpp"
      - "include/raft/certificate_authority*.hpp"
      - "src/certificate_authority.cpp"
      - "cmd/ca_cluster_node/**"
      - "third_party/pkcs11/**"
      - "cmake/kythira_test_helpers.cmake"
      - "cmake/Kconfig.cmake"
      - "scripts/check_module_boundaries.py"
      - "scripts/tests/test_check_module_boundaries.py"
      - "configs/ci_full_defconfig"
      - "configs/ci_no_hsm_defconfig"
      - "configs/ci_dynamodb_defconfig"
      - "Kconfig"
      - "CMakeLists.txt"
      - ".github/workflows/hsm-module.yml"
  pull_request:
    branches: ['**']
    # Keep in step with the push list above.
    paths:
      - "services/hsm/**"
      # The chaos scenario's encrypted-services layout runs the KMS.
      - "services/kms/**"
      - "services/README.md"
      - "include/raft/pkcs11*.hpp"
      - "include/raft/certificate_authority*.hpp"
      - "src/certificate_authority.cpp"
      - "cmd/ca_cluster_node/**"
      - "third_party/pkcs11/**"
      - "cmake/kythira_test_helpers.cmake"
      - "cmake/Kconfig.cmake"
      - "scripts/check_module_boundaries.py"
      - "scripts/tests/test_check_module_boundaries.py"
      - "configs/ci_full_defconfig"
      - "configs/ci_no_hsm_defconfig"
      - "configs/ci_dynamodb_defconfig"
      - "Kconfig"
      - "CMakeLists.txt"
      - ".github/workflows/hsm-module.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsm-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    name: HSM module boundary check
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KYTHIRA_X64_RUNNER || 'bit63' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fixture tests first, so a broken checker cannot pass the tree by
      # reporting nothing (same order as ci.yml's kconfig-check).
      - name: Module boundary checker passes its fixture tests
        run: python3 scripts/tests/test_check_module_boundaries.py -v
      - name: services/hsm uses only Kythira's public surface
        run: python3 scripts/check_module_boundaries.py

  build:
    name: HSM module on and off (clang++-18, x64)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KYTHIRA_X64_RUNNER || 'bit63' }}
    # A warm vcpkg tree and sccache make this minutes. A cold vcpkg tree is
    # config-variants' 78-minute install, which this job shares by key.
    timeout-minutes: 180
    # The read-write build-cache key is an environment secret of
    # build-cache-write (main only); same-repository pull requests write
    # with the create-only pr key, and everything else reads only. See
    # doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          # autoconf & co. are for vcpkg's gperf port, needed only on a cold
          # vcpkg cache; see ci.yml's build-and-test job.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev softhsm2 \
                 libtss2-dev swtpm swtpm-tools \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Only reached on a cold vcpkg cache: the edhoc feature builds the
      # lakers overlay port from Rust source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}
          kythira-cache-url: ${{ vars.KYTHIRA_BUILD_CACHE_URL }}
          kythira-cache-rw-user: ${{ vars.KYTHIRA_BUILD_CACHE_RW_USER }}
          kythira-cache-rw-password: ${{ secrets.KYTHIRA_BUILD_CACHE_RW_PASSWORD }}
          kythira-cache-pr-user: ${{ vars.KYTHIRA_BUILD_CACHE_PR_USER }}
          kythira-cache-pr-password: ${{ secrets.KYTHIRA_BUILD_CACHE_PR_PASSWORD }}
          kythira-cache-ro-user: ${{ vars.KYTHIRA_BUILD_CACHE_RO_USER }}
          kythira-cache-ro-password: ${{ secrets.KYTHIRA_BUILD_CACHE_RO_PASSWORD }}

      # Byte-identical to ci.yml's x64 clang++-18 key (config-variants and
      # the clang build-and-test leg), so this job reuses their tree.
      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-clang++-18-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          # clang-built ports, for mold: see ci.yml's build-and-test vcpkg step.
          export CC=clang-18 CXX=clang++-18
          export LDFLAGS="-Wl,--push-state,--no-as-needed -latomic -Wl,--pop-state"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (module on, ci_full_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_full_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      # Every test labelled hsm, built by name. The list comes from ctest, so
      # a new test joins without an edit here.
      - name: Build the module's tests
        run: |
          mapfile -t tests < <(ctest --test-dir build -N -L '^hsm$' \
            | sed -n 's/^ *Test *#[0-9]*: \(.*\)$/\1/p')
          if (( ${#tests[@]} == 0 )); then
            echo "::error::no test carries the hsm label in the module-on build"
            exit 1
          fi
          echo "HSM tests: ${tests[*]}"
          # Some tests (hsm_node_self_test) have no target of their own;
          # build the tests that are targets, plus the daemon the self-test
          # runs.
          mapfile -t known < <(ninja -C build -t targets all | sed -n 's/^\([^:]*\):.*/\1/p')
          targets=(hsm_node)
          for t in "${tests[@]}"; do
            if printf '%s\n' "${known[@]}" | grep -qxF "$t"; then
              targets+=("$t")
            fi
          done
          echo "Building: ${targets[*]}"
          cmake --build build -j"$(nproc)" --target "${targets[@]}"

      - name: Run the module's tests
        run: ctest --test-dir build -L '^hsm$' --output-on-failure --no-tests=error

      # libkythira_pkcs11.so under the consumers requirement 5.6 names
      # (task 10b): hsm_pkcs11_consumers_test serves a node and runs each
      # through services/hsm/pkcs11/tests/consumers.sh. The library is the
      # one just built, with vcpkg's static OpenSSL, as it ships.
      - name: Install the PKCS#11 consumers
        run: |
          for attempt in 1 2 3; do
            if timeout 600 sudo apt-get install -y --no-install-recommends \
                 opensc pkcs11-provider p11-kit p11-kit-modules gnutls-bin; then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::apt-get install failed after 3 attempts" >&2
              exit 1
            fi
            sleep 30
          done
          go version
          java -version

      # Google's pkcs11test at a pinned commit, built from source (it has
      # no release or package).
      - name: Build pkcs11test
        run: |
          git clone --filter=blob:none https://github.com/google/pkcs11test.git /tmp/pkcs11test
          git -C /tmp/pkcs11test checkout 2cbe462c62bacf537b9a9a427a1c053d8c2e4760
          make -C /tmp/pkcs11test -j"$(nproc)" CXX=g++
          echo "PKCS11TEST=/tmp/pkcs11test/pkcs11test" >> "$GITHUB_ENV"

      - name: Run the PKCS#11 consumer tests
        run: |
          cmake build -DKYTHIRA_HSM_CONSUMER_TESTS=ON
          cmake --build build -j"$(nproc)" --target hsm_pkcs11_consumers_test
          ctest --test-dir build -L '^hsm-consumers$' --output-on-failure --no-tests=error

      - name: Configure (module off, ci_no_hsm_defconfig, strict)
        run: |
          cmake -B build-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_no_hsm_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      - name: Assert nothing of the module is configured with it off
        run: |
          rc=0
          # `hsm-module`, the label only module tests carry
          # (services/hsm/tests/CMakeLists.txt).
          if ctest --test-dir build -N -L '^hsm-module$' | grep -q '^ *Test *#'; then :; else
            echo "::error::no hsm-module test in the module-on build, so the check below proves nothing"
            rc=1
          fi
          if ctest --test-dir build-off -N -L '^hsm-module$' | grep -q '^ *Test *#'; then
            echo "::error::an hsm-module test exists with CONFIG_HSM off"
            rc=1
          fi
          # Every output Ninja knows; a module target or object would sit
          # under build-off/services/hsm/ or be named after the module.
          if ninja -C build-off -t targets all \
               | grep -E '(^|/)services/hsm/|kythira_hsm|hsm_node|libkythira_pkcs11'; then
            echo "::error::a services/hsm target exists with CONFIG_HSM off"
            rc=1
          fi
          exit $rc

  # Task 11, Requirement 13.5: three hsm_node processes with the token
  # group's leader killed during key generation and the catalog's leader
  # killed during rekeys (hsm_node_cluster_test). hsm_node is the daemon
  # only where its groups have RocksDB, so this job configures
  # ci_dynamodb_defconfig (ci_full_defconfig with the RocksDB engine) on
  # the tree composite-node.yml and dynamodb-module.yml share.
  cluster:
    name: hsm_node cluster (clang++-18, x64)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KYTHIRA_X64_RUNNER || 'bit63' }}
    timeout-minutes: 180
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}
          kythira-cache-url: ${{ vars.KYTHIRA_BUILD_CACHE_URL }}
          kythira-cache-rw-user: ${{ vars.KYTHIRA_BUILD_CACHE_RW_USER }}
          kythira-cache-rw-password: ${{ secrets.KYTHIRA_BUILD_CACHE_RW_PASSWORD }}
          kythira-cache-pr-user: ${{ vars.KYTHIRA_BUILD_CACHE_PR_USER }}
          kythira-cache-pr-password: ${{ secrets.KYTHIRA_BUILD_CACHE_PR_PASSWORD }}
          kythira-cache-ro-user: ${{ vars.KYTHIRA_BUILD_CACHE_RO_USER }}
          kythira-cache-ro-password: ${{ secrets.KYTHIRA_BUILD_CACHE_RO_PASSWORD }}

      # composite-node.yml's and dynamodb-module.yml's key: one tree with
      # RocksDB.
      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-rocksdb-clang++-18-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          export CC=clang-18 CXX=clang++-18
          export LDFLAGS="-Wl,--push-state,--no-as-needed -latomic -Wl,--pop-state"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc --x-feature=rocksdb
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      - name: Configure (module on, ci_dynamodb_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_dynamodb_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      - name: Build hsm_node and its tests
        run: |
          if ! ctest --test-dir build -N -R '^hsm_node_cluster_test$' | grep -q '^ *Test *#'; then
            echo "::error::hsm_node_cluster_test is not registered: hsm_node is not the daemon here"
            exit 1
          fi
          cmake --build build -j"$(nproc)" --target hsm_node hsm_node_cluster_test

      - name: Run the hsm_node tests
        run: ctest --test-dir build -R '^hsm_node_(self_test|help|refuses_other_services|cluster_test)$' --output-on-failure --no-tests=error

  # Task 11b, Requirement 13.6: the docker-chaos scenario
  # (services/hsm/tests/docker/hsm_chaos_test.cpp) in its layouts,
  # stand-alone hsm_node and kythira_node with the HSM beside Redis, under
  # Docker and rootless Podman: leader kills during key generation and
  # rekey, and a partitioned leader. Its third layout is the KMS's
  # (.kiro/specs/kms-compatible-api/ task 19, Requirement 14.5): the HSM,
  # the KMS, DynamoDB and Kinesis in kythira_node, encrypted writes under
  # a kill and a partition, and the plaintext scan. Same configuration and
  # vcpkg tree as the cluster job.
  container:
    name: HSM chaos in containers (${{ matrix.runtime }})
    runs-on: ${{ (matrix.runtime == 'podman' && 'ubuntu-24.04') || (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KYTHIRA_X64_RUNNER || 'bit63' }}
    timeout-minutes: 180
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      # Docker as the runner ships it, or rootless Podman with netavark and
      # aardvark-dns, set up the one way every container workflow shares.
      - name: Set up the container runtime
        uses: ./.github/actions/setup-container-runtime
        with:
          runtime: ${{ matrix.runtime }}

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: x64-linux
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}
          kythira-cache-url: ${{ vars.KYTHIRA_BUILD_CACHE_URL }}
          kythira-cache-rw-user: ${{ vars.KYTHIRA_BUILD_CACHE_RW_USER }}
          kythira-cache-rw-password: ${{ secrets.KYTHIRA_BUILD_CACHE_RW_PASSWORD }}
          kythira-cache-pr-user: ${{ vars.KYTHIRA_BUILD_CACHE_PR_USER }}
          kythira-cache-pr-password: ${{ secrets.KYTHIRA_BUILD_CACHE_PR_PASSWORD }}
          kythira-cache-ro-user: ${{ vars.KYTHIRA_BUILD_CACHE_RO_USER }}
          kythira-cache-ro-password: ${{ secrets.KYTHIRA_BUILD_CACHE_RO_PASSWORD }}

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-rocksdb-clang++-18-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          export CC=clang-18 CXX=clang++-18
          export LDFLAGS="-Wl,--push-state,--no-as-needed -latomic -Wl,--pop-state"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux --no-print-usage --x-feature=edhoc --x-feature=rocksdb
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # CONTAINER_RUNTIME is explicit because the runner has both binaries
      # and auto-detection prefers docker.
      - name: Configure (module on, ci_dynamodb_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_dynamodb_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCONTAINER_RUNTIME=${{ matrix.runtime }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/x64-linux

      # Builds hsm_node, kythira_node and the scenario, stages the
      # kythira-hsm-chaos image and runs every layout.
      - name: docker-hsm-chaos-tests
        run: cmake --build build --target docker-hsm-chaos-tests -j"$(nproc)"

      - name: Podman service log
        if: always() && matrix.runtime == 'podman'
        run: tail -n 200 "$RUNNER_TEMP/podman-service.log" || true

      - name: Leftover containers
        if: always()
        run: ${{ matrix.runtime }} ps -a
