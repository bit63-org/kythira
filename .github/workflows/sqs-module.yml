# The SQS module's own workflow (services/sqs/, services/README.md
# "CI", .kiro/specs/sqs-compatible-queues/ Requirement 1.3). ci.yml is
# the gate: it builds the module and runs its tests on every pull request,
# because ci_full_defconfig sets CONFIG_SQS=y. This workflow adds, for
# changes to the module or what it builds on:
#
#   - the boundary check (also in ci.yml's kconfig-check job);
#   - a module-on build of just the module's targets, with its tests (every
#     test labelled sqs), so a module change gets an answer in minutes
#     instead of after the full build-and-test legs;
#   - a module-off configure (configs/ci_no_sqs_defconfig) that asserts
#     no SQS target or sqs-module test exists with the switch off;
#   - the client suites (services/sqs/tests/clients/): the AWS CLI, boto3
#     on both protocols, Kombu, the Go, JavaScript and Java SDKs (v2, and v1
#     on query), JMS, Spring Cloud AWS and the Extended Client against the
#     sqs_node the build job made.
#
# The module-off configure does not build core: ci.yml's config-variants job
# already builds every target of minimal_defconfig, where CONFIG_SQS is
# off by default, and the boundary check's core-includes-module rule keeps
# core from including a module header at all.
#
# NOT a required check: GitHub reports nothing for a workflow its paths
# filter skips, so a required check from it would hang every unrelated pull
# request. Whoever merges a pull request that touches the module waits for
# this workflow too (services/README.md).
#
# The container job, which runs the module's compose scenario under rootful
# Docker and rootless Podman (CLAUDE.md, "Container runtime compatibility";
# Requirement 1.3), joins with the first task whose daemon serves requests.

name: SQS Module

on:
  push:
    branches: [main]
    paths:
      - "services/sqs/**"
      - "services/README.md"
      - "cmake/kythira_test_helpers.cmake"
      - "cmake/Kconfig.cmake"
      - "scripts/check_module_boundaries.py"
      - "scripts/tests/test_check_module_boundaries.py"
      - "configs/ci_full_defconfig"
      - "configs/ci_dynamodb_defconfig"
      - "configs/ci_no_sqs_defconfig"
      - "Kconfig"
      - "CMakeLists.txt"
      - ".github/workflows/sqs-module.yml"
  pull_request:
    branches: ['**']
    # Keep in step with the push list above.
    paths:
      - "services/sqs/**"
      - "services/README.md"
      - "cmake/kythira_test_helpers.cmake"
      - "cmake/Kconfig.cmake"
      - "scripts/check_module_boundaries.py"
      - "scripts/tests/test_check_module_boundaries.py"
      - "configs/ci_full_defconfig"
      - "configs/ci_dynamodb_defconfig"
      - "configs/ci_no_sqs_defconfig"
      - "Kconfig"
      - "CMakeLists.txt"
      - ".github/workflows/sqs-module.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqs-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    name: SQS module boundary check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fixture tests first, so a broken checker cannot pass the tree by
      # reporting nothing (same order as ci.yml's kconfig-check).
      - name: Module boundary checker passes its fixture tests
        run: python3 scripts/tests/test_check_module_boundaries.py -v
      - name: services/sqs uses only Kythira's public surface
        run: python3 scripts/check_module_boundaries.py

  build:
    name: SQS module on and off (clang++-18, x64)
    runs-on: ubuntu-24.04
    # A warm vcpkg tree and sccache make this minutes. A cold vcpkg tree is
    # config-variants' 78-minute install, which this job shares by key.
    timeout-minutes: 180
    # The read-write build-cache key is an environment secret of
    # build-cache-write (main only); same-repository pull requests write
    # with the create-only pr key, and everything else reads only. See
    # doc/ci_build_cache.md.
    environment: ${{ github.ref == 'refs/heads/main' && 'build-cache-write' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          # autoconf & co. are for vcpkg's gperf port, needed only on a cold
          # vcpkg cache; see ci.yml's build-and-test job.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 clang-18 cmake ninja-build libfiu-dev \
                 autoconf autoconf-archive automake libtool mold; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install kconfiglib
        run: pip3 install --user -r scripts/kconfig/requirements.txt

      # Only reached on a cold vcpkg cache: the edhoc feature builds the
      # lakers overlay port from Rust source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Resolve vcpkg triplet
        id: triplet
        run: echo "value=x64-linux" >> "$GITHUB_OUTPUT"

      - name: OCI build cache
        id: buildcache
        uses: ./.github/actions/oci-build-cache
        with:
          triplet: ${{ steps.triplet.outputs.value }}
          rw-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID }}
          rw-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY }}
          pr-access-key-id: ${{ secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID }}
          pr-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY }}
          ro-access-key-id: ${{ secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID }}
          ro-secret-access-key: ${{ secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.OCI_BUILD_CACHE_BUCKET }}
          namespace: ${{ vars.OCI_BUILD_CACHE_NAMESPACE }}
          region: ${{ vars.OCI_CI_REGION }}

      # With RocksDB, which the durable sqs_node keeps its replica in: the
      # module tests, the split client suites and the container scenario
      # all run it. Byte-identical to dynamodb-module.yml's key and ci.yml's
      # rocksdb config variant, so this job reuses their tree.
      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-edhoc-rocksdb-clang++-18-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Bootstrap vcpkg and install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          echo "vcpkg binary cache: ${VCPKG_BINARY_SOURCES:-<none>}"
          # clang-built ports, for mold: see ci.yml's build-and-test vcpkg step.
          export CC=clang-18 CXX=clang++-18
          export LDFLAGS="-Wl,--push-state,--no-as-needed -latomic -Wl,--pop-state"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 9a7f7340a6c5f11f24c3d59f85e07143feb84e06
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet ${{ steps.triplet.outputs.value }} --no-print-usage --x-feature=edhoc --x-feature=rocksdb
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.value }}

      - name: Start sccache
        id: sccache
        if: steps.buildcache.outputs.enabled == 'true'
        run: scripts/oci-build-cache/start-sccache.sh

      # ci_full_defconfig plus the RocksDB engine (ci_dynamodb_defconfig,
      # which keeps CONFIG_SQS=y), so sqs_node is built durable.
      - name: Configure (module on, ci_dynamodb_defconfig, strict)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_dynamodb_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher || 'none' }} \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      # Every test labelled sqs, built by name. The list comes from ctest, so
      # a new test joins without an edit here.
      - name: Build the module's tests
        run: |
          mapfile -t tests < <(ctest --test-dir build -N -L '^sqs$' \
            | sed -n 's/^ *Test *#[0-9]*: \(.*\)$/\1/p')
          if (( ${#tests[@]} == 0 )); then
            echo "::error::no test carries the sqs label in the module-on build"
            exit 1
          fi
          echo "SQS tests: ${tests[*]}"
          # Some tests are scripts (the coverage and generated-header
          # checks) with no target of their own; build the tests that are
          # targets, plus the daemon the self-test runs.
          mapfile -t known < <(ninja -C build -t targets all | sed -n 's/^\([^:]*\):.*/\1/p')
          targets=(sqs_node)
          for t in "${tests[@]}"; do
            if printf '%s\n' "${known[@]}" | grep -qxF "$t"; then
              targets+=("$t")
            fi
          done
          echo "Building: ${targets[*]}"
          cmake --build build -j"$(nproc)" --target "${targets[@]}"

      - name: Run the module's tests
        run: ctest --test-dir build -L '^sqs$' --output-on-failure --no-tests=error

      # The client suites run in their own job, on this build's daemon.
      - name: Hand sqs_node to the client suites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqs-node
          path: build/sqs_node
          retention-days: 1
          if-no-files-found: error

      - name: Configure (module off, ci_no_sqs_defconfig, strict)
        run: |
          cmake -B build-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DKYTHIRA_KCONFIG=configs/ci_no_sqs_defconfig \
            -DKYTHIRA_KCONFIG_STRICT=ON \
            -DKYTHIRA_LINKER=mold \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/vcpkg_installed/${{ steps.triplet.outputs.value }}

      - name: Assert nothing of the module is configured with it off
        run: |
          rc=0
          # `sqs-module`, not `sqs`: a core suite the module builds on may
          # carry `sqs` too and rightly exist with the module off.
          if ctest --test-dir build -N -L '^sqs-module$' | grep -q '^ *Test *#'; then :; else
            echo "::error::no sqs-module test in the module-on build, so the check below proves nothing"
            rc=1
          fi
          if ctest --test-dir build-off -N -L '^sqs-module$' | grep -q '^ *Test *#'; then
            echo "::error::a sqs-module test exists with CONFIG_SQS off"
            rc=1
          fi
          # Every output Ninja knows; a module target or object would sit
          # under build-off/services/sqs/ or be named after the module.
          if ninja -C build-off -t targets all \
               | grep -E '(^|/)services/sqs/|kythira_sqs|sqs_node'; then
            echo "::error::a services/sqs target exists with CONFIG_SQS off"
            rc=1
          fi
          exit $rc

  clients:
    # Task 12 (Requirements 13.1, 13.2): real SQS clients against the
    # sqs_node this run built (in-memory, then durable in the split
    # layouts of task 10), through
    # services/sqs/tests/clients/run_suite.sh. Every client is pinned: the
    # Python ones by requirements files, the AWS CLI by version, Go by
    # go.sum, JavaScript by package-lock.json, the Java ones by their
    # Gradle builds, which run in the digest-pinned Gradle
    # image the Kinesis module uses so there is one JDK and Gradle to keep
    # current.
    name: SQS client suites
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch sqs_node
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqs-node
          path: ${{ runner.temp }}/sqs

      - name: Install system dependencies
        run: |
          ./scripts/drop-unused-apt-repos.sh
          # libcurl's headers build pycurl, which Kombu's SQS transport needs.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q \
                 && timeout 600 sudo apt-get install -y --no-install-recommends \
                 libcurl4-openssl-dev libssl-dev python3-venv unzip; then
              exit 0
            fi
            echo "::warning::apt-get install failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          echo "::error::apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Python clients
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r services/sqs/tests/clients/requirements.txt
          python3 -m venv "$RUNNER_TEMP/venvq"
          "$RUNNER_TEMP/venvq/bin/pip" install -q -r services/sqs/tests/evidence/requirements-query.txt

      - name: AWS CLI v2 (2.31.0, the evidence pin)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/awscli.zip" \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.31.0.zip
          unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP/awscli-src"
          "$RUNNER_TEMP/awscli-src/aws/install" -i "$RUNNER_TEMP/awscli" -b "$RUNNER_TEMP/awsbin"
          "$RUNNER_TEMP/awsbin/aws" --version

      - name: Java clients
        env:
          GRADLE_IMAGE: gradle:8.14.3-jdk21@sha256:21bd311ed01360c189b8870c6b6e988199ff10f72d445d02fb39d3cff9da91d7
        run: |
          # One worker: Maven Central answers bursts of parallel downloads
          # with 429s.
          for dir in services/sqs/tests/evidence/clients/java services/sqs/tests/clients/java; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -e GRADLE_USER_HOME=/work/.gradle-home \
              -v "$PWD:/work" -w "/work/$dir" \
              "$GRADLE_IMAGE" gradle --no-daemon --max-workers=1 installDist
          done

      - name: Go and JavaScript clients
        env:
          GO_IMAGE: golang:1.24.7-bookworm@sha256:b8bae5bd9ba9b1f89b635c91c24cc75cea335a16fb5076310f38566fc674b1ec
          NODE_IMAGE: node:22.21.1-bookworm-slim@sha256:25b3eb23a00590b7499f2a2ce939322727fcce1b15fdd69754fcd09536a3ae2c
        run: |
          # Built in pinned images, run on the runner: a static Go binary,
          # and the lockfile's node_modules for the runner's Node.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GOCACHE=/work/.go-cache -e GOMODCACHE=/work/.go-mod -e CGO_ENABLED=0 \
            -v "$PWD:/work" -v "$RUNNER_TEMP:/out" -w /work/services/sqs/tests/clients/go \
            "$GO_IMAGE" go build -o /out/sqs-suite-go .
          docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/work/.npm-cache \
            -v "$PWD:/work" -w /work/services/sqs/tests/clients/js \
            "$NODE_IMAGE" npm ci --no-audit --no-fund

      - name: Run the client suites
        env:
          SUITE_GO: ${{ runner.temp }}/sqs-suite-go
          SQS_NODE: ${{ runner.temp }}/sqs/sqs_node
          SUITE_PYTHON: ${{ runner.temp }}/venv/bin/python
          QUERY_PYTHON: ${{ runner.temp }}/venvq/bin/python
          AWS_CLI: ${{ runner.temp }}/awsbin/aws
          JAVA_CLIENTS: ${{ github.workspace }}/services/sqs/tests/evidence/clients/java/build/install/sqs-evidence-java/bin
          SUITE_JAVA_CLIENTS: ${{ github.workspace }}/services/sqs/tests/clients/java/build/install/sqs-suite-spring/bin
        run: |
          chmod +x "$SQS_NODE"
          # The start scripts were built for the image's JDK 21; run them on
          # the runner's.
          export JAVA_HOME=$JAVA_HOME_21_X64
          services/sqs/tests/clients/run_suite.sh

      # Task 10: the same clients through a gateway, a front end and three
      # data nodes, on plaintext and over TLS with layer identities.
      - name: Run the client suites on the split layouts
        env:
          SUITE_GO: ${{ runner.temp }}/sqs-suite-go
          SQS_NODE: ${{ runner.temp }}/sqs/sqs_node
          SUITE_PYTHON: ${{ runner.temp }}/venv/bin/python
          QUERY_PYTHON: ${{ runner.temp }}/venvq/bin/python
          AWS_CLI: ${{ runner.temp }}/awsbin/aws
          JAVA_CLIENTS: ${{ github.workspace }}/services/sqs/tests/evidence/clients/java/build/install/sqs-evidence-java/bin
          SUITE_JAVA_CLIENTS: ${{ github.workspace }}/services/sqs/tests/clients/java/build/install/sqs-suite-spring/bin
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          for layout in split split-tls; do
            echo "### $layout"
            SQS_SUITE_LAYOUT=$layout services/sqs/tests/clients/run_suite.sh
          done

      # Task 13: the differential mix against a node at SQS's default
      # limits, self-checked, then compared with every checked-in recording
      # of real SQS (services/sqs/tests/differential/recordings/).
      - name: Replay the SQS differential
        env:
          SQS_NODE: ${{ runner.temp }}/sqs/sqs_node
          SUITE_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: services/sqs/tests/differential/run_replay.sh
