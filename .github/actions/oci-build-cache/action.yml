#
# Picks the credential for the triggering event and exports one environment
# that vcpkg's x-aws backend and sccache's s3 backend both read
# (.kiro/specs/oci-build-cache/ Requirements 3 and 4, design.md Component 2).
#
# The writer policy lives here and nowhere else: a push to main gets the
# read-write key, a pull request from a branch of this repository gets the
# PR-writer key, everything else gets the read-only one, and a run with no
# key at all (a pull request from a fork, where GitHub withholds secrets)
# turns both caches off and builds anyway. IAM enforces the same rule from
# the other side -- the ro user cannot create objects, and the pr user can
# create but never overwrite -- so a bug in the case statement below is
# refused by the service rather than poisoning a cache.
#
# The action also decides, by probing, whether sccache may be used at all --
# and exports RUSTC_WRAPPER only if the probe passes. That decision has to
# live here rather than in each job, because the lakers port's cargo build
# runs under RUSTC_WRAPPER during the vcpkg install, which happens before any
# per-job guard runs. See the probe step for the measurement behind it.
#
# This action never fails a build because a cache is unavailable. It fails
# only when a repository VARIABLE is missing, which is a configuration error
# with a one-line fix, and when the sccache download does not match its
# pinned checksum, which is a wrong binary on the compile path.

name: OCI build cache
description: Select the build-cache credential for this event and export it for vcpkg and sccache

inputs:
  triplet:
    description: vcpkg triplet, e.g. x64-linux — selects the bucket prefix
    required: true
  rw-access-key-id:
    description: secrets.OCI_BUILD_CACHE_RW_ACCESS_KEY_ID
    required: false
    default: ""
  rw-secret-access-key:
    description: secrets.OCI_BUILD_CACHE_RW_SECRET_ACCESS_KEY
    required: false
    default: ""
  pr-access-key-id:
    description: secrets.OCI_BUILD_CACHE_PR_ACCESS_KEY_ID — create-only key for same-repository pull requests
    required: false
    default: ""
  pr-secret-access-key:
    description: secrets.OCI_BUILD_CACHE_PR_SECRET_ACCESS_KEY
    required: false
    default: ""
  ro-access-key-id:
    description: secrets.OCI_BUILD_CACHE_RO_ACCESS_KEY_ID
    required: false
    default: ""
  ro-secret-access-key:
    description: secrets.OCI_BUILD_CACHE_RO_SECRET_ACCESS_KEY
    required: false
    default: ""
  bucket:
    description: vars.OCI_BUILD_CACHE_BUCKET
    required: false
    default: ""
  namespace:
    description: vars.OCI_BUILD_CACHE_NAMESPACE — the Object Storage namespace in the endpoint host
    required: false
    default: ""
  region:
    description: vars.OCI_CI_REGION
    required: false
    default: ""
  kythira-cache-url:
    description: >-
      vars.KYTHIRA_BUILD_CACHE_URL — base URL(s) of the self-hosted kythira
      cache's HTTP front end (redis_gateway_node), space- or
      comma-separated, tried in order, e.g.
      "http://192.168.12.21:18091 http://192.168.12.21:18092".
      Used only on self-hosted runners.
    required: false
    default: ""
  kythira-cache-rw-user:
    description: vars.KYTHIRA_BUILD_CACHE_RW_USER — read_write ACL user for main
    required: false
    default: ""
  kythira-cache-rw-password:
    description: secrets.KYTHIRA_BUILD_CACHE_RW_PASSWORD (build-cache-write environment)
    required: false
    default: ""
  kythira-cache-pr-user:
    description: vars.KYTHIRA_BUILD_CACHE_PR_USER — ACL user for same-repository pull requests
    required: false
    default: ""
  kythira-cache-pr-password:
    description: secrets.KYTHIRA_BUILD_CACHE_PR_PASSWORD
    required: false
    default: ""
  kythira-cache-ro-user:
    description: vars.KYTHIRA_BUILD_CACHE_RO_USER — read_only ACL user for everything else
    required: false
    default: ""
  kythira-cache-ro-password:
    description: secrets.KYTHIRA_BUILD_CACHE_RO_PASSWORD
    required: false
    default: ""
  sccache-version:
    description: pinned sccache release; the checksums below belong to it
    required: false
    default: "0.17.0"

outputs:
  enabled:
    description: "true when a credential was found and the environment was exported"
    value: ${{ steps.kythira.outputs.enabled == 'true' && 'true' || steps.select.outputs.enabled }}
  backend:
    description: "kythira, oci, or none: which cache the environment points at"
    value: ${{ steps.kythira.outputs.enabled == 'true' && 'kythira' || (steps.select.outputs.enabled == 'true' && 'oci' || 'none') }}

runs:
  using: composite
  steps:
    # The self-hosted kythira cache comes first, and only on a self-hosted
    # runner. It is a redis_gateway_node cluster on new-reliant, on the same
    # private network as the bit63 runner pods, and is not reachable
    # from GitHub-hosted runners -- so a GitHub-hosted job (arm64, fork pull
    # requests, or every job after vars.KYTHIRA_X64_RUNNER is pointed back at
    # ubuntu-24.04) skips straight to the OCI bucket below and behaves
    # exactly as before.
    #
    # The writer policy is the OCI one, unchanged: main gets the read_write
    # user, a same-repository pull request the pr user, everything else the
    # read_only user. The gateway's ACL role is what enforces it; the
    # *_RW_MODE variables only stop sccache and vcpkg asking to be told no.
    #
    # sccache talks WebDAV and vcpkg its `http` binary source, both against
    # the gateway's HTTP front end (doc/redis-gateway.md "Clients"). Neither
    # needs the AWS CLI, which ARC runner images do not carry.
    #
    # If the cache does not answer, or answers 401/403 to the probe, this
    # step falls through to OCI rather than failing: a cache is never a build
    # dependency (Requirement 3.5).
    - name: Select the self-hosted kythira cache
      id: kythira
      if: runner.environment == 'self-hosted' && inputs.kythira-cache-url != ''
      shell: bash
      env:
        URL: ${{ inputs.kythira-cache-url }}
        RW_USER: ${{ inputs.kythira-cache-rw-user }}
        RW_PASSWORD: ${{ inputs.kythira-cache-rw-password }}
        PR_USER: ${{ inputs.kythira-cache-pr-user }}
        PR_PASSWORD: ${{ inputs.kythira-cache-pr-password }}
        RO_USER: ${{ inputs.kythira-cache-ro-user }}
        RO_PASSWORD: ${{ inputs.kythira-cache-ro-password }}
        TRIPLET: ${{ inputs.triplet }}
      run: |
        set -euo pipefail
        # URL may list several nodes, separated by spaces or commas. Every
        # node of the cluster serves every key (writes are forwarded to the
        # shard leader), so the first one that answers is used for the
        # whole job; the others are only there for when a node is down.
        read -r -a urls <<< "${URL//,/ }"
        url="${urls[0]%/}"

        same_repo=false
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -r "${GITHUB_EVENT_PATH:-}" ]; then
          head_repo=$(jq -r '.pull_request.head.repo.full_name // ""' "$GITHUB_EVENT_PATH")
          [ "$head_repo" = "${GITHUB_REPOSITORY}" ] && same_repo=true
        fi

        # Same patterns as the OCI step: exact matches on main, `*` last.
        case "${GITHUB_EVENT_NAME}:${GITHUB_REF_NAME}:${same_repo}" in
          push:main:*|schedule:main:*|workflow_dispatch:main:*)
                     user="$RW_USER"; pass="$RW_PASSWORD"; mode="readwrite"; which="read-write" ;;
          pull_request:*:true)
                     user="$PR_USER"; pass="$PR_PASSWORD"; mode="readwrite"; which="pr-writer" ;;
          *)         user="$RO_USER"; pass="$RO_PASSWORD"; mode="read";      which="read-only" ;;
        esac
        # A missing writer credential degrades to read-only, never to a
        # different writer.
        if [ "$mode" = "readwrite" ] && { [ -z "$user" ] || [ -z "$pass" ]; }; then
          user="$RO_USER"; pass="$RO_PASSWORD"; mode="read"; which="read-only (no ${which} credential in this job)"
        fi
        if [ -z "$user" ] || [ -z "$pass" ]; then
          echo "::warning::kythira cache at ${url}: no credential for ${GITHUB_EVENT_NAME} on ${GITHUB_REF_NAME}; trying the OCI bucket"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        auth_b64=$(printf '%s:%s' "$user" "$pass" | base64 -w0)
        # GitHub masks the password but not its base64, and vcpkg's source
        # string carries the header. Several workflows echo
        # VCPKG_BINARY_SOURCES, so mask it before anything can print it.
        echo "::add-mask::${auth_b64}"

        # One authenticated GET of sccache's own check object per node, in
        # order. 200 or 404 both prove the node is up and the user
        # authenticates; 401/403 means the ACL or secret is wrong (no point
        # asking the other nodes, which share the ACL); 000 means
        # unreachable, so try the next node.
        picked=""
        for candidate in "${urls[@]}"; do
          candidate="${candidate%/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 1 --retry-connrefused \
                   -H "Authorization: Basic ${auth_b64}" "${candidate}/sccache/.sccache_check" || true)
          case "$code" in
            200|404) picked="$candidate"; break ;;
            401|403)
              echo "::warning::kythira cache at ${candidate} refused ${user} (HTTP ${code}); check the ACL and secret"
              break ;;
            *) echo "::warning::kythira cache at ${candidate} answered HTTP ${code}; trying the next node" ;;
          esac
        done
        if [ -z "$picked" ]; then
          echo "::warning::no kythira cache node served ${user}; trying the OCI bucket"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        url="$picked"
        echo "build cache: kythira at ${url}, ${which} user ${user}, vcpkg mode=${mode}, prefix vcpkg/${TRIPLET}/"

        {
          echo "KYTHIRA_BUILD_CACHE_BACKEND=kythira"
          # Read by scripts/tidy-cache.py's HTTP backend.
          echo "KYTHIRA_CACHE_HTTP_URL=${url}"
          echo "KYTHIRA_CACHE_HTTP_USER=${user}"
          echo "KYTHIRA_CACHE_HTTP_PASSWORD=${pass}"
          echo "OCI_BUILD_CACHE_MODE=${mode}"
          # The template is {sha}.zip under vcpkg/<triplet>/, the key the
          # bucket's x-aws backend uses, so packages seeded from the bucket
          # are hits; the fourth field is a header vcpkg sends with every
          # request.
          echo "VCPKG_BINARY_SOURCES=clear;http,${url}/vcpkg/${TRIPLET}/{sha}.zip,${mode},Authorization: Basic ${auth_b64}"
          echo "SCCACHE_WEBDAV_ENDPOINT=${url}/sccache"
          echo "SCCACHE_WEBDAV_USERNAME=${user}"
          echo "SCCACHE_WEBDAV_PASSWORD=${pass}"
          if [ "${mode}" = "readwrite" ]; then
            echo "SCCACHE_WEBDAV_RW_MODE=READ_WRITE"
          else
            echo "SCCACHE_WEBDAV_RW_MODE=READ_ONLY"
          fi
          echo "VCPKG_KEEP_ENV_VARS=RUSTC_WRAPPER;SCCACHE_WEBDAV_ENDPOINT;SCCACHE_WEBDAV_USERNAME;SCCACHE_WEBDAV_PASSWORD;SCCACHE_WEBDAV_RW_MODE"
          # Checkout-relative keys, as on the OCI path: this runner checks
          # out under /home/runner/_work, GitHub-hosted ones under
          # /home/runner/work, and both must find each other's entries.
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}"
        } >> "$GITHUB_ENV"
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    # A second, read-only vcpkg source behind the kythira cache: the OCI
    # bucket, with the read-only key. The kythira cache starts empty and
    # only main writes to it, so without this every self-hosted job builds
    # all ~135 ports from source until main has run, and a port whose
    # upstream tarball no longer matches the baseline's SHA512 (libunwind
    # 1.8.3 from GitHub's archive endpoint, first seen on 2026-11-20) fails
    # the job outright, where a GitHub-hosted job restores the package from
    # the bucket and never downloads it. vcpkg tries sources in order and
    # writes only to sources marked readwrite, so the bucket is never
    # written from here. Skipped, without failing, when the read-only key or
    # the AWS CLI is missing.
    #
    # sccache gets the same fallback through its multi-level chain
    # (SCCACHE_MULTILEVEL_CHAIN, sccache >= 0.15): the kythira cache first,
    # then the bucket, read-only. Pull requests only read the kythira
    # cache, and until main has run there it holds no compiler output, so
    # every self-hosted pull-request build compiled from scratch: 0 hits in
    # 466 compiles on #943's g++-13 leg, which ran out its 3-hour timeout
    # at step 892 of 1910. The bucket is what main's GitHub-hosted jobs
    # have been filling all along. Read-only levels are never written, and
    # on main a hit in the bucket is copied back into the kythira cache, so
    # the bucket matters less with every main run. The write-error policy
    # is `ignore` because a cache must never fail a compile.
    - name: Read vcpkg packages and compiler output from the OCI bucket as a fallback
      if: steps.kythira.outputs.enabled == 'true'
      shell: bash
      env:
        RO_ID: ${{ inputs.ro-access-key-id }}
        RO_SECRET: ${{ inputs.ro-secret-access-key }}
        BUCKET: ${{ inputs.bucket }}
        NAMESPACE: ${{ inputs.namespace }}
        REGION: ${{ inputs.region }}
        TRIPLET: ${{ inputs.triplet }}
      run: |
        set -euo pipefail
        for v in RO_ID RO_SECRET BUCKET NAMESPACE REGION TRIPLET; do
          if [ -z "${!v}" ]; then
            echo "no OCI fallback for vcpkg: ${v} is empty"
            exit 0
          fi
        done
        if ! command -v aws >/dev/null 2>&1; then
          echo "::warning::no AWS CLI on this runner; vcpkg reads the kythira cache only"
          exit 0
        fi
        # Same settings the OCI-only path uses (see the next step for why
        # each one is there); this source only reads, so the multipart
        # settings are moot but harmless.
        aws_config="${RUNNER_TEMP}/oci-build-cache-aws-config"
        printf '%s\n' '[default]' 's3 =' \
          '    preferred_transfer_client = classic' \
          '    multipart_threshold = 5GB' \
          '    multipart_chunksize = 5GB' > "${aws_config}"
        endpoint="https://${NAMESPACE}.compat.objectstorage.${REGION}.oraclecloud.com"
        echo "build cache: vcpkg and sccache fall back to s3://${BUCKET}/ (read-only key)"
        {
          echo "AWS_CONFIG_FILE=${aws_config}"
          echo "AWS_ENDPOINT_URL=${endpoint}"
          echo "AWS_REGION=${REGION}"
          echo "AWS_ACCESS_KEY_ID=${RO_ID}"
          echo "AWS_SECRET_ACCESS_KEY=${RO_SECRET}"
          echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"
          echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
          echo "VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES};x-aws,s3://${BUCKET}/vcpkg/${TRIPLET}/,read"
          echo "SCCACHE_MULTILEVEL_CHAIN=webdav,s3"
          echo "SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=ignore"
          echo "SCCACHE_BUCKET=${BUCKET}"
          echo "SCCACHE_ENDPOINT=${endpoint}"
          echo "SCCACHE_REGION=${REGION}"
          echo "SCCACHE_S3_KEY_PREFIX=sccache/"
          echo "SCCACHE_S3_USE_SSL=true"
          echo "SCCACHE_S3_RW_MODE=READ_ONLY"
          # vcpkg scrubs port builds' environment (see the OCI-only step).
          echo "VCPKG_KEEP_ENV_VARS=${VCPKG_KEEP_ENV_VARS};SCCACHE_MULTILEVEL_CHAIN;SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY;SCCACHE_BUCKET;SCCACHE_ENDPOINT;SCCACHE_REGION;SCCACHE_S3_KEY_PREFIX;SCCACHE_S3_USE_SSL;SCCACHE_S3_RW_MODE;AWS_ENDPOINT_URL;AWS_REGION;AWS_ACCESS_KEY_ID;AWS_SECRET_ACCESS_KEY;AWS_REQUEST_CHECKSUM_CALCULATION;AWS_RESPONSE_CHECKSUM_VALIDATION;AWS_CONFIG_FILE"
        } >> "$GITHUB_ENV"

    - name: Select credential and export the cache environment
      id: select
      if: steps.kythira.outputs.enabled != 'true'
      shell: bash
      env:
        # Passed through the environment rather than interpolated into the
        # script body: a secret spliced into a shell script is one quoting
        # mistake away from being executed, and `${{ }}` interpolation happens
        # before bash ever sees the line.
        RW_ID: ${{ inputs.rw-access-key-id }}
        RW_SECRET: ${{ inputs.rw-secret-access-key }}
        PR_ID: ${{ inputs.pr-access-key-id }}
        PR_SECRET: ${{ inputs.pr-secret-access-key }}
        RO_ID: ${{ inputs.ro-access-key-id }}
        RO_SECRET: ${{ inputs.ro-secret-access-key }}
        BUCKET: ${{ inputs.bucket }}
        NAMESPACE: ${{ inputs.namespace }}
        REGION: ${{ inputs.region }}
        TRIPLET: ${{ inputs.triplet }}
      run: |
        set -euo pipefail

        # Variables first. These are repository *variables*, not secrets, so
        # they are present on fork pull requests too; one being empty means
        # the repository is misconfigured, and failing here costs a few
        # seconds instead of a whole build that silently cached nothing.
        missing=0
        for v in BUCKET NAMESPACE REGION TRIPLET; do
          if [ -z "${!v}" ]; then
            echo "::error::${v} is empty — set the repository variable (see .kiro/specs/oci-build-cache/)"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1

        # The writer policy is "only code that is on main may write", and it
        # is expressed as exact matches on both halves. Every pattern below
        # pins the ref to `main`: `*` is deliberately the last pattern and
        # deliberately not a prefix match on refs/heads/main, which would
        # also match main-foo.
        #
        # schedule and workflow_dispatch were added on 2026-09-22. They are
        # how real-cloud-tests.yml runs, and pinning the ref is what keeps
        # them safe to trust: a scheduled run is always on the default
        # branch, and a dispatch names its own ref, so a dispatch from a
        # feature branch still falls through to read-only. Before this they
        # fell to `*` and each of the five provider jobs compiled ~558
        # translation units it could never store -- sccache attempted every
        # upload and was refused every time, which is what the paired
        # SCCACHE_S3_RW_MODE below now prevents.
        #
        # pull_request was added on 2026-11-06, for pull requests whose head
        # branch lives in THIS repository only. They get a separate key, the
        # pr user's, which IAM lets create objects but not overwrite them: a
        # pull request can add cache entries but never replace one that main
        # wrote. Only people who can push branches here can open such a pull
        # request. A fork's pull request is excluded twice, by the head-repo
        # check below and by GitHub withholding every secret from it.
        # pull_request_target is never used for this, and must not be: it
        # would hand the key to a fork's code.
        same_repo=false
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -r "${GITHUB_EVENT_PATH:-}" ]; then
          head_repo=$(jq -r '.pull_request.head.repo.full_name // ""' "$GITHUB_EVENT_PATH")
          [ "$head_repo" = "${GITHUB_REPOSITORY}" ] && same_repo=true
        fi

        case "${GITHUB_EVENT_NAME}:${GITHUB_REF_NAME}:${same_repo}" in
          push:main:*|schedule:main:*|workflow_dispatch:main:*)
                     key_id="$RW_ID"; secret="$RW_SECRET"; mode="readwrite"; which="read-write" ;;
          pull_request:*:true)
                     key_id="$PR_ID"; secret="$PR_SECRET"; mode="readwrite"; which="pr-writer (create-only)" ;;
          *)         key_id="$RO_ID"; secret="$RO_SECRET"; mode="read";      which="read-only" ;;
        esac

        # Until the pr key exists as repository secrets, a same-repository
        # pull request reads exactly as it did before.
        if [ "$which" != "read-write" ] && [ "$mode" = "readwrite" ] && { [ -z "$key_id" ] || [ -z "$secret" ]; }; then
          key_id="$RO_ID"; secret="$RO_SECRET"; mode="read"; which="read-only (no pr-writer key in this run)"
        fi

        # The read-write key is an environment secret of build-cache-write
        # (main only), not a repository secret, so a job on main that runs
        # in another environment -- real-cloud-tests.yml's provider jobs --
        # does not receive it. Such a job still reads the cache rather than
        # building cold.
        if [ "$mode" = "readwrite" ] && { [ -z "$key_id" ] || [ -z "$secret" ]; }; then
          key_id="$RO_ID"; secret="$RO_SECRET"; mode="read"; which="read-only (no read-write key in this job's environment)"
        fi

        if [ -z "$key_id" ] || [ -z "$secret" ]; then
          echo "::warning::no OCI build-cache credential for ${GITHUB_EVENT_NAME} on ${GITHUB_REF_NAME}; both caches disabled for this run"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "build cache: ${which} key, vcpkg mode=${mode}, prefix vcpkg/${TRIPLET}/"

        # vcpkg's x-aws backend shells out to the AWS CLI. Asserted rather
        # than assumed: it is present on ubuntu-24.04 and ubuntu-24.04-arm
        # today, and if a future image drops it every port would rebuild from
        # source with only a per-port warning to say so.
        #
        # On a self-hosted runner (bit63) the image is not GitHub's and
        # may not carry the CLI. There the bucket is only the fallback for
        # when the kythira cache is unset or down, so a missing CLI turns the
        # vcpkg binary cache off with a warning instead of failing the job;
        # sccache talks S3 itself and keeps working.
        vcpkg_source=on
        if ! command -v aws >/dev/null 2>&1; then
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            echo "::warning::the AWS CLI is not on this self-hosted runner; vcpkg binary cache off for this job (sccache still uses the bucket)"
            vcpkg_source=off
          else
            echo "::error::the AWS CLI is not on this runner; vcpkg's x-aws backend cannot work"
            exit 1
          fi
        else
          aws --version
        fi

        # Every upload is one PutObject, never a multipart upload. OCI asks
        # for OBJECT_CREATE *and* OBJECT_OVERWRITE on CreateMultipartUpload
        # and UploadPart even for a new object, and the pull-request key has
        # no OBJECT_OVERWRITE, by design, so a PR cannot replace an entry
        # main wrote. The AWS CLI switches to multipart at 8 MiB by default,
        # so every larger vcpkg package uploaded from a PR was refused
        # (OCI answers NoSuchBucket on CreateMultipartUpload); RocksDB's
        # was the first seen, on 2026-11-10. A single PUT takes up to 5 GiB,
        # far above any port archive. vcpkg's x-aws backend runs
        # `aws s3 cp`, which reads these settings from AWS_CONFIG_FILE.
        aws_config="${RUNNER_TEMP}/oci-build-cache-aws-config"
        printf '%s\n' '[default]' 's3 =' \
          '    preferred_transfer_client = classic' \
          '    multipart_threshold = 5GB' \
          '    multipart_chunksize = 5GB' > "${aws_config}"

        endpoint="https://${NAMESPACE}.compat.objectstorage.${REGION}.oraclecloud.com"
        {
          echo "AWS_CONFIG_FILE=${aws_config}"
          echo "AWS_ENDPOINT_URL=${endpoint}"
          echo "AWS_REGION=${REGION}"
          echo "AWS_ACCESS_KEY_ID=${key_id}"
          echo "AWS_SECRET_ACCESS_KEY=${secret}"
          # Without these two, every upload fails against OCI with
          #   NotImplemented: AWS chunked encoding not supported
          # AWS CLI 2.23 flipped its default to when_supported, which sends
          # PutObject as an aws-chunked stream with a trailing checksum; OCI's
          # S3 Compatibility API does not implement that framing. vcpkg's
          # x-aws backend shells out to this CLI, so a port upload is exactly
          # this call — measured on aws-cli/2.23.6: refused with the default,
          # byte-identical round-trip with when_required.
          echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"
          echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
          if [ "$vcpkg_source" = on ]; then
            echo "VCPKG_BINARY_SOURCES=clear;x-aws,s3://${BUCKET}/vcpkg/${TRIPLET}/,${mode}"
          fi
          # Stated, not inferred, for other consumers of these credentials
          # (the clang-tidy result cache): readwrite or read.
          echo "OCI_BUILD_CACHE_MODE=${mode}"
          echo "SCCACHE_BUCKET=${BUCKET}"
          echo "SCCACHE_ENDPOINT=${endpoint}"
          echo "SCCACHE_REGION=${REGION}"
          echo "SCCACHE_S3_KEY_PREFIX=sccache/"
          echo "SCCACHE_S3_USE_SSL=true"
          # Tell sccache what the key it was handed can actually do. Without
          # this it defaults to attempting writes, and a read-only key turns
          # every cache miss into a refused upload: measured at 558 misses
          # and 558 write errors on the 2026-09-14 real-cloud run, with
          # `Cache errors 0` printed two lines below them. READ_ONLY makes it
          # read the cache and stop there. Values are sccache 0.17.0's own
          # (READ_ONLY / READ_WRITE), confirmed against the pinned binary.
          if [ "${mode}" = "readwrite" ]; then
            echo "SCCACHE_S3_RW_MODE=READ_WRITE"
          else
            echo "SCCACHE_S3_RW_MODE=READ_ONLY"
          fi
          # RUSTC_WRAPPER is deliberately NOT exported here. It is exported
          # by the probe step below, and only if a compile really does
          # round-trip through sccache -- see that step for why.
          # vcpkg scrubs the environment of port builds. Without this the
          # lakers port's cargo build sees no RUSTC_WRAPPER and no
          # credentials, which is the rustc coverage ccache never had.
          echo "VCPKG_KEEP_ENV_VARS=RUSTC_WRAPPER;SCCACHE_BUCKET;SCCACHE_ENDPOINT;SCCACHE_REGION;SCCACHE_S3_KEY_PREFIX;SCCACHE_S3_USE_SSL;SCCACHE_S3_RW_MODE;AWS_ENDPOINT_URL;AWS_REGION;AWS_ACCESS_KEY_ID;AWS_SECRET_ACCESS_KEY;AWS_REQUEST_CHECKSUM_CALCULATION;AWS_RESPONSE_CHECKSUM_VALIDATION;AWS_CONFIG_FILE"
          # Key entries by paths relative to the checkout. sccache hashes
          # the preprocessed source, whose line markers carry absolute
          # paths, so the same tree checked out at /home/runner/work/...
          # (GitHub-hosted) and /home/runner/_work/... (self-hosted
          # runners) shares almost no entries: 6 hits in 91 compiles on a
          # bit63 job reading the bucket main's hosted jobs fill. sccache
          # strips this prefix before hashing (its CCACHE_BASEDIR), which a
          # two-directory build confirmed (0 hits without, 1 of 2 with).
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}"
        } >> "$GITHUB_ENV"
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - name: Install the pinned sccache
      if: steps.kythira.outputs.enabled == 'true' || steps.select.outputs.enabled == 'true'
      shell: bash
      env:
        SCCACHE_VERSION: ${{ inputs.sccache-version }}
      run: |
        set -euo pipefail

        # There is no apt package, so this is a release tarball pinned by
        # version AND by checksum. The checksums were taken by downloading
        # each asset and hashing it, and they agree with the .sha256 files
        # published beside them.
        case "${RUNNER_ARCH}" in
          X64)
            target=x86_64-unknown-linux-musl
            sha=67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006 ;;
          ARM64)
            target=aarch64-unknown-linux-musl
            sha=821a86343191aa1cbab74bd42f9e93c9a63bf85e4742945f40d3ae84193c1c77 ;;
          *)
            echo "::error::no pinned sccache for RUNNER_ARCH=${RUNNER_ARCH}"
            exit 1 ;;
        esac

        # The checksums above belong to 0.17.0. Refuse rather than install an
        # unverified binary if someone bumps the input without bumping them.
        if [ "${SCCACHE_VERSION}" != "0.17.0" ]; then
          echo "::error::sccache-version=${SCCACHE_VERSION} but the pinned checksums in this action are for 0.17.0"
          exit 1
        fi

        tarball="sccache-v${SCCACHE_VERSION}-${target}.tar.gz"
        url="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${tarball}"
        tmp=$(mktemp -d)

        # A failed DOWNLOAD degrades to no compiler cache; a failed CHECKSUM
        # fails the job. The asymmetry is the whole point:
        #
        #   - GitHub being unreachable for 20 seconds is not a reason to kill
        #     a two-hour build. This action's own header promises the cache is
        #     never a build dependency, and until this change it broke that
        #     promise — Task 1 lost `Build & Test (g++-13, arm64)` sixty
        #     seconds in to a transient download while the other arm64 leg
        #     passed the identical step.
        #   - A checksum mismatch is a *wrong binary on the compile path*.
        #     That is not something to warn about and continue from, so it
        #     stays fatal.
        #
        # `set -e` is disabled for the download only, so the failure is
        # handled here rather than aborting the step.
        set +e
        curl --retry 3 --retry-delay 5 -sSfL -o "${tmp}/${tarball}" "$url"
        curl_rc=$?
        set -e
        if [ "$curl_rc" -ne 0 ]; then
          echo "::warning::could not download sccache (curl exit ${curl_rc}); this leg will build with no compiler cache"
          rm -rf "$tmp"
          exit 0
        fi

        # Fatal on purpose — see above.
        echo "${sha}  ${tmp}/${tarball}" | sha256sum -c -
        tar xzf "${tmp}/${tarball}" -C "$tmp"
        # A self-hosted runner image may not carry sudo; install for this
        # job only in that case.
        if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
          sudo install -m 0755 "${tmp}/sccache-v${SCCACHE_VERSION}-${target}/sccache" /usr/local/bin/sccache
        else
          mkdir -p "${RUNNER_TEMP}/sccache-bin"
          install -m 0755 "${tmp}/sccache-v${SCCACHE_VERSION}-${target}/sccache" "${RUNNER_TEMP}/sccache-bin/sccache"
          echo "${RUNNER_TEMP}/sccache-bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/sccache-bin:${PATH}"
        fi
        rm -rf "$tmp"
        sccache --version

    # The probe has to happen HERE, inside the action, and not in each job's
    # "Start sccache" step, because of RUSTC_WRAPPER. That step runs *after*
    # "Bootstrap vcpkg and install dependencies", and the lakers port's cargo
    # build runs under RUSTC_WRAPPER during that install. Measured on sccache
    # 0.17.0 against an unreachable endpoint: `sccache rustc --version` exits
    # 2, so cargo fails, so the lakers port fails, so the vcpkg install fails,
    # so the job goes red -- which is the cache failure Requirement 3.5
    # forbids, reached by a path no per-job guard can cover because it happens
    # before that guard runs.
    #
    # This has never fired in practice only because the `vcpkg_installed/`
    # tree cache has been hitting, which skips the install entirely. It would
    # fire on the first cold build with a misconfigured bucket.
    #
    # So: probe once, before anything can use sccache, and export
    # RUSTC_WRAPPER only if a compile really round-trips. Each job's own
    # "Start sccache" step runs the same script again for its C/C++ launcher
    # decision; the second probe hits the cache the first one populated.
    - name: Probe sccache before the vcpkg install can use it
      id: probe
      if: steps.kythira.outputs.enabled == 'true' || steps.select.outputs.enabled == 'true'
      shell: bash
      run: scripts/oci-build-cache/start-sccache.sh

    - name: Export RUSTC_WRAPPER only if the probe passed
      if: steps.probe.outputs.launcher == 'sccache'
      shell: bash
      run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
